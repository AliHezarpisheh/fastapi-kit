[project]
name = "fastapi-kit"
version = "0.1.0"
description = """
Streamlined repository for storing essential backend development configurations,
utilities, and documentation for personal fastapi projects.
"""
authors = [{name = "alihezarpisheh", email = "alihezarpisheh@outlook.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.44",
    "tomlkit>=0.13.3",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14.8",
]
testing = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-order>=1.3.0",
    "pytest-randomly>=4.0.1",
]
